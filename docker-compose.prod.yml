name: microservice-whatsapp

services:
  whatsapp-app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      GATEWAY_SECRET_AUTH: ${GATEWAY_SECRET_AUTH}
      MICROSERVICE_STORAGE: ${MICROSERVICE_STORAGE}
      MICROSERVICE_STORAGE_TOKEN: ${MICROSERVICE_STORAGE_TOKEN}

    restart: unless-stopped
    volumes:
      - microservice-whatsapp-session:/app/session
    depends_on:
      - whatsapp-db
    command: >
      sh -c "
      npm run build &&
      npm run prisma:generate &&
      npm run prisma:deploy &&
      npm run start
      "

  whatsapp-db:
    image: postgres
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    volumes:
      - microservice-whatsapp-postgresql:/var/lib/postgresql/data

volumes:
  microservice-whatsapp-postgresql:
  microservice-whatsapp-session:

networks:
  default:
    external: true
    name: microservices-network
